<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <defs>
        <!-- Fond : un vrai rectangle bleu, foncé vers vif -->
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="0.5" stop-color="#1166d0" />
            <stop offset="1" stop-color="#0b4aa8" />
        </linearGradient>
        <!-- Bleu clair brillant pour les bandes en relief -->
        <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5fb0ff" />
            <stop offset="1" stop-color="#2a8ef0" />
        </linearGradient>
        <!-- Bleu nuit pour les bandes sombres -->
        <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#082a63" />
            <stop offset="1" stop-color="#051a40" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="3" dy="3" stdDeviation="2.5" flood-color="#020a1c" flood-opacity="0.6" />
        </filter>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
    </defs>

    <g clip-path="url(#clip)">
        <rect width="400" height="120" fill="url(#bg)" />

        <g filter="url(#shadow)" stroke-linecap="round" fill="none">
            <!-- Bandes en haut à gauche -->
            <line x1="10" y1="-20" x2="80" y2="50" stroke="url(#light)" stroke-width="14" />
            <line x1="40" y1="-20" x2="100" y2="40" stroke="url(#dark)" stroke-width="10" />

            <!-- Chevron « > » en trois couches -->
            <polyline points="196,-6 262,60 196,126" stroke="url(#dark)" stroke-width="18" stroke-linejoin="miter" />
            <polyline points="214,-6 280,60 214,126" stroke="url(#light)" stroke-width="16" stroke-linejoin="miter" />
            <polyline points="236,4 292,60 236,116" stroke="#0a3374" stroke-width="6" stroke-linejoin="miter" />

            <!-- Bandes en bas à droite -->
            <line x1="330" y1="70" x2="390" y2="130" stroke="url(#light)" stroke-width="14" />
            <line x1="305" y1="80" x2="355" y2="130" stroke="url(#dark)" stroke-width="10" />
            <line x1="350" y1="-10" x2="410" y2="50" stroke="url(#dark)" stroke-width="10" />
        </g>
    </g>
</svg>
