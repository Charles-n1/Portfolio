<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Circuit imprimé : pistes et connecteurs -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0b4aa8" />
            <stop offset="1" stop-color="#083a85" />
        </linearGradient>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
    </defs>
    <g clip-path="url(#clip)">
        <rect width="400" height="120" fill="url(#bg)" />
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <!-- pistes sombres -->
            <g stroke="#072b66" stroke-width="4">
                <path d="M0 30 H90 L110 50 H200" />
                <path d="M0 90 H60 L80 70 H170 L190 90 H260" />
                <path d="M400 20 H320 L300 40 H240" />
                <path d="M400 100 H330 L310 80 H280" />
            </g>
            <!-- pistes lumineuses -->
            <g stroke="#6cbcff" stroke-width="2">
                <path d="M0 60 H130 L150 40 H230 L250 60 H400" />
                <path d="M200 120 V100 L220 80 H260" />
                <path d="M120 0 V15 L135 30 H180" />
            </g>
            <g stroke="#b8f2ff" stroke-width="1">
                <path d="M0 64 H128 L148 44 H232 L252 64 H400" />
            </g>
        </g>
        <!-- connecteurs -->
        <g fill="#083a85" stroke="#9fd0ff" stroke-width="1.5">
            <circle cx="200" cy="50" r="4" />
            <circle cx="260" cy="90" r="4" />
            <circle cx="240" cy="40" r="4" />
            <circle cx="280" cy="80" r="4" />
            <circle cx="260" cy="80" r="3.5" />
            <circle cx="180" cy="30" r="3.5" />
        </g>
        <rect x="300" y="50" width="34" height="20" rx="2" fill="#072b66" stroke="#6cbcff" stroke-width="1.5" />
    </g>
</svg>
