<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Grille en perspective style synthwave + soleil rayé -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#051a40" />
            <stop offset="1" stop-color="#0a3d8f" />
        </linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#082a63" />
        </linearGradient>
        <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8ae8ff" />
            <stop offset="1" stop-color="#1e7fff" />
        </linearGradient>
        <!-- Rayures horizontales découpées dans le soleil -->
        <mask id="sunStripes">
            <rect width="400" height="120" fill="#fff" />
            <rect x="0" y="34" width="400" height="2" fill="#000" />
            <rect x="0" y="40" width="400" height="3" fill="#000" />
            <rect x="0" y="46" width="400" height="4" fill="#000" />
        </mask>
        <clipPath id="floorClip"><rect y="50" width="400" height="70" /></clipPath>
        <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
            <feGaussianBlur stdDeviation="2" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
    </defs>

    <g clip-path="url(#clip)">
        <rect width="400" height="50" fill="url(#sky)" />
        <rect y="50" width="400" height="70" fill="url(#floor)" />

        <!-- Soleil -->
        <circle cx="200" cy="50" r="32" fill="url(#sun)" mask="url(#sunStripes)" />

        <!-- Sol : lignes qui convergent vers le point de fuite -->
        <g clip-path="url(#floorClip)" stroke="#5fb0ff" stroke-opacity="0.7" stroke-width="1">
            <line x1="200" y1="50" x2="-600" y2="120" />
            <line x1="200" y1="50" x2="-550" y2="120" />
            <line x1="200" y1="50" x2="-500" y2="120" />
            <line x1="200" y1="50" x2="-450" y2="120" />
            <line x1="200" y1="50" x2="-400" y2="120" />
            <line x1="200" y1="50" x2="-350" y2="120" />
            <line x1="200" y1="50" x2="-300" y2="120" />
            <line x1="200" y1="50" x2="-250" y2="120" />
            <line x1="200" y1="50" x2="-200" y2="120" />
            <line x1="200" y1="50" x2="-150" y2="120" />
            <line x1="200" y1="50" x2="-100" y2="120" />
            <line x1="200" y1="50" x2="-50" y2="120" />
            <line x1="200" y1="50" x2="0" y2="120" />
            <line x1="200" y1="50" x2="50" y2="120" />
            <line x1="200" y1="50" x2="100" y2="120" />
            <line x1="200" y1="50" x2="150" y2="120" />
            <line x1="200" y1="50" x2="200" y2="120" />
            <line x1="200" y1="50" x2="250" y2="120" />
            <line x1="200" y1="50" x2="300" y2="120" />
            <line x1="200" y1="50" x2="350" y2="120" />
            <line x1="200" y1="50" x2="400" y2="120" />
            <line x1="200" y1="50" x2="450" y2="120" />
            <line x1="200" y1="50" x2="500" y2="120" />
            <line x1="200" y1="50" x2="550" y2="120" />
            <line x1="200" y1="50" x2="600" y2="120" />
            <line x1="200" y1="50" x2="650" y2="120" />
            <line x1="200" y1="50" x2="700" y2="120" />
            <line x1="200" y1="50" x2="750" y2="120" />
            <line x1="200" y1="50" x2="800" y2="120" />
            <line x1="200" y1="50" x2="850" y2="120" />
            <line x1="200" y1="50" x2="900" y2="120" />
            <line x1="200" y1="50" x2="950" y2="120" />
            <line x1="200" y1="50" x2="1000" y2="120" />
        </g>

        <!-- Sol : lignes horizontales de plus en plus espacées -->
        <g stroke="#5fb0ff" stroke-opacity="0.7" stroke-width="1">
            <line x1="0" y1="53" x2="400" y2="53" />
            <line x1="0" y1="57" x2="400" y2="57" />
            <line x1="0" y1="63" x2="400" y2="63" />
            <line x1="0" y1="71" x2="400" y2="71" />
            <line x1="0" y1="82" x2="400" y2="82" />
            <line x1="0" y1="97" x2="400" y2="97" />
            <line x1="0" y1="117" x2="400" y2="117" />
        </g>

        <!-- Horizon lumineux -->
        <rect y="49" width="400" height="2" fill="#8ae8ff" filter="url(#glow)" />
    </g>
</svg>
