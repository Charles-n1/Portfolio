<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Panneaux en relief + barres lumineuses + points + petits carrés + passage de l’éclair -->
    <defs>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
        <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
            <feGaussianBlur stdDeviation="1.8" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#020a1c" flood-opacity="0.6" />
        </filter>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0d55bd" />
            <stop offset="1" stop-color="#0a3d8f" />
        </linearGradient>
        <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0c3c86" />
            <stop offset="1" stop-color="#061f4a" />
        </linearGradient>
        <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3d9bff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#6cbcff" stop-opacity="1" />
            <stop offset="1" stop-color="#3d9bff" stop-opacity="0" />
        </linearGradient>
        <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#9fd0ff" />
        </pattern>
        <radialGradient id="dotsFade" cx="0.9" cy="0.85" r="0.3">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </radialGradient>
        <mask id="dotsMask"><rect width="400" height="120" fill="url(#dotsFade)" /></mask>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
            <rect width="2" height="6" fill="#ffffff" fill-opacity="0.06" />
        </pattern>
    </defs>

    <g clip-path="url(#clip)">
        <rect width="400" height="120" fill="url(#bg)" />
        <rect width="400" height="120" fill="url(#hatch)" />
        <rect width="400" height="120" fill="url(#dots)" mask="url(#dotsMask)" opacity="0.8" />

        <g transform="rotate(-35 200 60)">
            <!-- Panneaux sombres en relief -->
            <g filter="url(#shadow)">
                <rect x="-20" y="18" width="300" height="24" fill="url(#panel)" />
                <rect x="140" y="64" width="320" height="18" fill="url(#panel)" />
                <rect x="40" y="100" width="220" height="14" fill="url(#panel)" />
            </g>
            <!-- Barres lumineuses le long des panneaux -->
            <g filter="url(#glow)">
                <rect x="0" y="42" width="280" height="5" fill="url(#bar)" />
                <rect x="160" y="82" width="300" height="4" fill="url(#bar)" />
                <rect x="60" y="54" width="220" height="1.4" fill="#b8f2ff" />
                <rect x="200" y="94" width="200" height="1.2" fill="#b8f2ff" />
            </g>
            <!-- Petits carrés -->
            <rect x="120" y="8" width="6" height="6" fill="#9fd0ff" />
            <rect x="300" y="52" width="5" height="5" fill="#9fd0ff" />
            <rect x="96" y="88" width="4" height="4" fill="#6cbcff" />
        </g>
    </g>
    <!-- Passage de eclair_6 en bleu clair (calculé pour la place de rect_14, écran 1920×918) -->
    <g clip-path="url(#clip)" fill="none" stroke-linejoin="miter" stroke-linecap="butt">
        <polyline points="125.6,-293.1 716.2,698 885.3,585.3 1185.6,1085.8" stroke="#2f7fe0" stroke-width="36.9" />
        <polyline points="125.6,-293.1 716.2,698 885.3,585.3 1185.6,1085.8" stroke="#7cc0ff" stroke-width="32.3" />
    </g>
</svg>
