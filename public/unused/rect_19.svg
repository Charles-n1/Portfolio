<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Lignes avec des pics nets, comme un signal électrique -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <pattern id="motif" width="48" height="30" patternUnits="userSpaceOnUse">
            <polyline points="0,15 16,15 20,4 26,26 30,15 48,15" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5" stroke-linejoin="miter" />
        </pattern>
    </defs>

    <rect width="400" height="120" fill="url(#bg)" />
    <rect width="400" height="120" fill="url(#motif)" />
</svg>
