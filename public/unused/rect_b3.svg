<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#05070b" />
            <stop offset="1" stop-color="#121a26" />
        </linearGradient>
        <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0a6bff" stop-opacity="0.15" />
            <stop offset="0.6" stop-color="#1e8cff" stop-opacity="1" />
            <stop offset="1" stop-color="#0a6bff" stop-opacity="0.2" />
        </linearGradient>
        <linearGradient id="barDim" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0b3f8c" stop-opacity="0" />
            <stop offset="0.5" stop-color="#0b3f8c" stop-opacity="0.8" />
            <stop offset="1" stop-color="#0b3f8c" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#4fd8ff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#8ae8ff" stop-opacity="1" />
            <stop offset="1" stop-color="#4fd8ff" stop-opacity="0" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
            <feGaussianBlur stdDeviation="2" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <!-- Hachures fines + hachures plus espacées -->
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
        </pattern>
        <pattern id="hatchWide" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
            <line x1="0" y1="0" x2="0" y2="22" stroke="#4da3ff" stroke-opacity="0.12" stroke-width="2" />
        </pattern>
        <radialGradient id="wideFade" cx="0.25" cy="0.5" r="0.4">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </radialGradient>
        <mask id="wideMask"><rect width="400" height="120" fill="url(#wideFade)" /></mask>
        <!-- Points -->
        <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="0.8" fill="#6ab8ff" fill-opacity="0.6" />
        </pattern>
        <radialGradient id="dotsFadeA" cx="0.88" cy="0.8" r="0.3">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="dotsFadeB" cx="0.45" cy="0.05" r="0.22">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </radialGradient>
        <mask id="dotsMaskA"><rect width="400" height="120" fill="url(#dotsFadeA)" /></mask>
        <mask id="dotsMaskB"><rect width="400" height="120" fill="url(#dotsFadeB)" /></mask>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
    </defs>

    <g clip-path="url(#clip)">
        <rect width="400" height="120" fill="url(#bg)" />
        <rect width="400" height="120" fill="url(#hatch)" />
        <rect width="400" height="120" fill="url(#hatchWide)" mask="url(#wideMask)" />
        <rect width="400" height="120" fill="url(#dots)" mask="url(#dotsMaskA)" />
        <rect width="400" height="120" fill="url(#dots)" mask="url(#dotsMaskB)" />

        <g transform="rotate(-35 200 60)">
            <!-- Panneaux translucides -->
            <rect x="60" y="30" width="300" height="14" fill="url(#barDim)" />
            <rect x="-40" y="92" width="260" height="20" fill="url(#barDim)" opacity="0.7" />
            <rect x="240" y="8" width="220" height="10" fill="url(#barDim)" opacity="0.8" />

            <!-- Petits carrés gris -->
            <rect x="150" y="20" width="6" height="6" fill="#3a4250" />
            <rect x="290" y="88" width="5" height="5" fill="#3a4250" />
            <rect x="60" y="66" width="4" height="4" fill="#4a5466" />

            <g filter="url(#glow)">
                <!-- Barres bleues -->
                <rect x="40" y="48" width="220" height="7" fill="url(#bar)" />
                <rect x="180" y="62" width="260" height="10" fill="url(#bar)" />
                <rect x="110" y="80" width="140" height="4" fill="url(#bar)" opacity="0.8" />
                <rect x="260" y="40" width="120" height="3" fill="url(#bar)" opacity="0.7" />
                <rect x="-30" y="104" width="200" height="6" fill="url(#bar)" opacity="0.9" />
                <rect x="300" y="20" width="160" height="5" fill="url(#bar)" opacity="0.8" />

                <!-- Fines lignes cyan -->
                <rect x="80" y="58" width="200" height="1.2" fill="url(#cyan)" />
                <rect x="220" y="88" width="180" height="1.2" fill="url(#cyan)" opacity="0.8" />
                <rect x="0" y="30" width="160" height="1" fill="url(#cyan)" opacity="0.6" />
            </g>
        </g>
    </g>
</svg>
