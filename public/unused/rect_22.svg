<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Petits éclairs en quinconce -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
            <feGaussianBlur stdDeviation="1.6" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <pattern id="motif" width="40" height="40" patternUnits="userSpaceOnUse">
            <polygon points="12,2 6,15 11,15 8,26 19,11 13,11 17,2" fill="#ffffff" fill-opacity="0.18" />
            <polygon points="32,22 26,35 31,35 28,46 39,31 33,31 37,22" fill="#ffffff" fill-opacity="0.1" />
            <polygon points="32,-18 26,-5 31,-5 28,6 39,-9 33,-9 37,-18" fill="#ffffff" fill-opacity="0.1" />
        </pattern>
    </defs>

    <rect width="400" height="120" fill="url(#bg)" />
    <rect width="400" height="120" fill="url(#motif)" />
</svg>
