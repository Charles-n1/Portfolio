<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Lignes horizontales fines (effet écran) -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <pattern id="motif" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="2" fill="#ffffff" fill-opacity="0.08" />
        </pattern>
    </defs>

    <rect width="400" height="120" fill="url(#bg)" />
    <rect width="400" height="120" fill="url(#motif)" />
</svg>
