<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- rect_17 + le passage de eclair_6 dessiné en bleu clair.
         Points calculés pour la place de rect_14 dans Projects.astro, sur un écran de 1920×918. -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
            <rect width="5" height="14" fill="#ffffff" fill-opacity="0.07" />
        </pattern>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
    </defs>

    <rect width="400" height="120" fill="url(#bg)" />
    <rect width="400" height="120" fill="url(#stripes)" />

    <!-- L'éclair : contour bleu moyen dessous, corps bleu clair dessus -->
    <g clip-path="url(#clip)" fill="none" stroke-linejoin="miter" stroke-linecap="butt">
        <polyline points="125.6,-293.1 716.2,698 885.3,585.3 1185.6,1085.8" stroke="#2f7fe0" stroke-width="36.9" />
        <polyline points="125.6,-293.1 716.2,698 885.3,585.3 1185.6,1085.8" stroke="#7cc0ff" stroke-width="32.3" />
    </g>
</svg>
