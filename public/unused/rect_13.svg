            <stop offset="0" stop-color="#1e7fff" />
            <stop offset="1" stop-color="#8ae8ff" />
        </linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#051a40" stop-opacity="0" />
            <stop offset="1" stop-color="#051a40" stop-opacity="0.6" />
        </linearGradient>
    </defs>

    <g clip-path="url(#clip)">
