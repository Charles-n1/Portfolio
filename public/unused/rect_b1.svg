<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <defs>
        <!-- Fond : presque noir, avec un léger bleu nuit -->
        <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#02040a" />
            <stop offset="0.6" stop-color="#03091a" />
            <stop offset="1" stop-color="#061633" />
        </linearGradient>

        <!-- Faisceaux : transparents aux bouts, lumineux au centre -->
        <linearGradient id="beamBlue" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0a5fd8" stop-opacity="0" />
            <stop offset="0.5" stop-color="#1e7fff" stop-opacity="1" />
            <stop offset="1" stop-color="#0a5fd8" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="beamCyan" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#4fd8ff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#8ae8ff" stop-opacity="1" />
            <stop offset="1" stop-color="#4fd8ff" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0b4fb3" stop-opacity="0" />
            <stop offset="0.5" stop-color="#0b4fb3" stop-opacity="0.45" />
            <stop offset="1" stop-color="#0b4fb3" stop-opacity="0" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Texture rocheuse très légère -->
        <filter id="rock" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" seed="7" result="noise" />
            <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1.5" result="light">
                <feDistantLight azimuth="45" elevation="55" />
            </feDiffuseLighting>
            <feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1="1.3" k2="0" k3="0" k4="0" />
        </filter>

        <clipPath id="clip">
            <rect width="400" height="120" />
        </clipPath>
    </defs>

    <g clip-path="url(#clip)">
        <rect width="400" height="120" fill="url(#fill)" filter="url(#rock)" />

        <!-- Faisceaux en diagonale (haut-gauche vers bas-droite) -->
        <g transform="rotate(35 200 60)">
            <!-- grands panneaux translucides -->
            <rect x="-80" y="20" width="560" height="22" fill="url(#panel)" />
            <rect x="-40" y="78" width="520" height="30" fill="url(#panel)" opacity="0.8" />

            <g filter="url(#glow)">
                <!-- faisceaux bleus -->
                <rect x="-60" y="10" width="420" height="4" fill="url(#beamBlue)" />
                <rect x="40" y="48" width="460" height="7" fill="url(#beamBlue)" />
                <rect x="-20" y="96" width="380" height="5" fill="url(#beamBlue)" opacity="0.9" />
                <rect x="120" y="128" width="360" height="9" fill="url(#beamBlue)" opacity="0.7" />

                <!-- fines lignes cyan -->
                <rect x="20" y="34" width="360" height="1.5" fill="url(#beamCyan)" />
                <rect x="140" y="66" width="300" height="2" fill="url(#beamCyan)" />
                <rect x="-40" y="114" width="320" height="1.2" fill="url(#beamCyan)" opacity="0.8" />
            </g>
        </g>
    </g>
</svg>
