<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Panneaux inclinés empilés, facettes à l’intérieur, arêtes lumineuses + passage de l’éclair -->
    <defs>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
        <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
            <feGaussianBlur stdDeviation="1.8" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#020a1c" flood-opacity="0.6" />
        </filter>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <clipPath id="slabs">
            <polygon points="0,0 180,0 140,120 0,120" />
        </clipPath>
        <linearGradient id="slabA" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2a8ef0" />
            <stop offset="1" stop-color="#1166d0" />
        </linearGradient>
        <linearGradient id="slabB" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0b4aa8" />
            <stop offset="1" stop-color="#082a63" />
        </linearGradient>
    </defs>

    <g clip-path="url(#clip)">
        <rect width="400" height="120" fill="url(#bg)" />

        <!-- Panneaux, du fond vers l'avant -->
        <g filter="url(#shadow)">
            <polygon points="0,0 250,0 210,120 0,120" fill="url(#slabB)" />
            <polygon points="0,0 180,0 140,120 0,120" fill="url(#slabA)" />
            <polygon points="0,0 110,0 70,120 0,120" fill="url(#slabB)" />
        </g>

