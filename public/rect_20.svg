<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Petites barres symétriques, comme une forme d onde audio -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <pattern id="motif" width="36" height="30" patternUnits="userSpaceOnUse">
            <g fill="#ffffff" fill-opacity="0.15">
                <rect x="2"  y="13" width="3" height="4" rx="1.5" />
                <rect x="8"  y="9"  width="3" height="12" rx="1.5" />
                <rect x="14" y="5"  width="3" height="20" rx="1.5" />
                <rect x="20" y="10" width="3" height="10" rx="1.5" />
                <rect x="26" y="7"  width="3" height="16" rx="1.5" />
                <rect x="32" y="12" width="3" height="6"  rx="1.5" />
            </g>
        </pattern>
    </defs>

    <rect width="400" height="120" fill="url(#bg)" />
    <rect width="400" height="120" fill="url(#motif)" />
</svg>
