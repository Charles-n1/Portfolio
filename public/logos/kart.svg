<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="260" height="160">
    <!-- Pilote de kart original, vu de profil (va vers la droite) -->
    <g stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <!-- Traits de vitesse -->
        <g stroke="#7cc0ff" stroke-width="4">
            <line x1="6" y1="70" x2="40" y2="70" />
            <line x1="14" y1="88" x2="44" y2="88" />
            <line x1="4" y1="106" x2="36" y2="106" />
        </g>

        <!-- Pot d'échappement -->
        <rect x="44" y="92" width="22" height="12" rx="4" fill="#9a9a9a" />

        <!-- Châssis du kart -->
        <path d="M60 112 L70 86 L150 86 L176 70 L222 82 L232 104 L220 116 L72 118 Z" fill="#e8332a" />
        <!-- Bande blanche sur le côté -->
        <path d="M84 102 L210 98 L216 106 L84 110 Z" fill="#ffffff" stroke-width="2" />

        <!-- Siège -->
        <path d="M92 86 L98 54 L114 54 L114 86 Z" fill="#1f4fbf" />

        <!-- Corps du pilote -->
        <path d="M110 86 L118 56 L142 58 L150 86 Z" fill="#2f7fe0" />
        <!-- Bras vers le volant -->
        <path d="M130 66 L160 72" stroke-width="10" stroke="#2f7fe0" />
        <!-- Gant -->
        <circle cx="162" cy="72" r="7" fill="#ffffff" />
        <!-- Volant -->
        <line x1="160" y1="86" x2="170" y2="64" stroke-width="5" />

        <!-- Casque -->
        <circle cx="128" cy="40" r="20" fill="#ffffff" />
        <!-- Visière -->
        <path d="M134 32 L149 34 L148 46 L134 46 Z" fill="#1f4fbf" />
        <!-- Bande du casque -->
        <path d="M109 36 L130 30" stroke="#e8332a" stroke-width="5" />

        <!-- Roues -->
        <circle cx="86" cy="120" r="20" fill="#2a2a2a" />
        <circle cx="86" cy="120" r="8" fill="#bdbdbd" />
        <circle cx="208" cy="120" r="18" fill="#2a2a2a" />
        <circle cx="208" cy="120" r="7" fill="#bdbdbd" />
    </g>
</svg>
