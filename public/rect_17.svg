<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Rayures fines en diagonale sur fond bleu -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
            <rect width="5" height="14" fill="#ffffff" fill-opacity="0.07" />
        </pattern>
    </defs>

    <rect width="400" height="120" fill="url(#bg)" />
    <rect width="400" height="120" fill="url(#stripes)" />
</svg>
