<svg xmlns="http://www.w3.org/2000/svg" viewBox="1469.9 4224.6 510.3 352" width="510.3" height="352">
    <!-- rect_5 déjà tourné de -44deg, coupé seulement en bas, au bord intérieur du cadre jaune de Contacts (fenêtre 1879x918, liste fermée).
         Le viewBox est en coordonnées de la page : il ne garde que la zone visible. -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <pattern id="hex" width="20" height="34.64" patternUnits="userSpaceOnUse">
            <path d="M10 0 L20 5.77 L20 17.32 L10 23.09 L0 17.32 L0 5.77 Z M10 23.09 L10 34.64 M0 17.32 L-10 23.09 M20 17.32 L30 23.09"
                  fill="none" stroke="#072b66" stroke-width="1.6" />
        </pattern>
        <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3d9bff" stop-opacity="0.7" />
            <stop offset="0.5" stop-color="#6cbcff" />
            <stop offset="1" stop-color="#3d9bff" stop-opacity="0.7" />
        </linearGradient>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
        <clipPath id="hexArea"><rect x="230" y="0" width="170" height="120" /></clipPath>
    </defs>
    <!-- Centre de l'ancienne balise (left 1450 + 275, top 4190 + 285), puis rotation -44deg -->
    <g transform="translate(1725 4475) rotate(-44)">
        <!-- rect_5 affiché en 550x165 (400x120 x 1.375), centré -->
        <svg x="-275" y="-82.5" width="550" height="165" viewBox="0 0 400 120">
            <g clip-path="url(#clip)">
                <rect width="400" height="120" fill="url(#bg)" />
                <rect width="400" height="120" fill="url(#hex)" clip-path="url(#hexArea)" />
                <g transform="rotate(-30 200 60)">
                    <rect x="-60" y="52" width="520" height="22" fill="#072b66" />
                    <rect x="-60" y="74" width="520" height="6" fill="url(#band)" />
                    <rect x="-60" y="44" width="520" height="2" fill="#b8f2ff" />
                </g>
            </g>
        </svg>
    </g>
</svg>
