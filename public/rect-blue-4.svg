<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <defs>
        <!-- Fond : gris anthracite vers noir -->
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1a1d24" />
            <stop offset="1" stop-color="#05070b" />
        </linearGradient>
        <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0a6bff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#1e8cff" stop-opacity="1" />
            <stop offset="1" stop-color="#0a6bff" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#4fd8ff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#8ae8ff" stop-opacity="1" />
            <stop offset="1" stop-color="#4fd8ff" stop-opacity="0" />
        </linearGradient>
        <!-- Panneaux sombres en relief -->
        <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2a2f3a" />
            <stop offset="1" stop-color="#0c0e13" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
            <feGaussianBlur stdDeviation="2" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="shadow" x="-10%" y="-50%" width="120%" height="200%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.8" />
        </filter>
        <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="0.8" fill="#6ab8ff" fill-opacity="0.6" />
        </pattern>
        <radialGradient id="dotsFade" cx="0.12" cy="0.2" r="0.28">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </radialGradient>
        <mask id="dotsMask"><rect width="400" height="120" fill="url(#dotsFade)" /></mask>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
    </defs>

    <g clip-path="url(#clip)">
        <rect width="400" height="120" fill="url(#bg)" />
        <rect width="400" height="120" fill="url(#dots)" mask="url(#dotsMask)" />

        <!-- Panneaux sombres + barres lumineuses en diagonale (haut-gauche vers bas-droite) -->
        <g transform="rotate(35 200 60)">
            <g filter="url(#shadow)">
                <rect x="40" y="10" width="360" height="26" fill="url(#panel)" />
                <rect x="-40" y="86" width="340" height="22" fill="url(#panel)" />
            </g>
            <g filter="url(#glow)">
                <rect x="60" y="36" width="320" height="6" fill="url(#bar)" />
                <rect x="-20" y="80" width="300" height="5" fill="url(#bar)" />
                <rect x="120" y="58" width="240" height="1.5" fill="url(#cyan)" />
                <rect x="0" y="112" width="260" height="1.2" fill="url(#cyan)" opacity="0.8" />
            </g>
        </g>
    </g>
</svg>
