<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Inspiré de rect-blue-3.svg (barres, hachures, points), tout en bleu et opaque -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b4aa8" />
            <stop offset="1" stop-color="#083a85" />
        </linearGradient>
        <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3d9bff" stop-opacity="0.7" />
            <stop offset="0.6" stop-color="#6cbcff" stop-opacity="1" />
            <stop offset="1" stop-color="#3d9bff" stop-opacity="0.7" />
        </linearGradient>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#0a3374" stroke-width="1.5" />
        </pattern>
        <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#9fd0ff" />
        </pattern>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
        <clipPath id="dotsA"><rect x="300" y="70" width="100" height="50" /></clipPath>
        <clipPath id="dotsB"><rect x="150" y="0" width="90" height="26" /></clipPath>
    </defs>
    <g clip-path="url(#clip)">
        <rect width="400" height="120" fill="url(#bg)" />
        <rect width="400" height="120" fill="url(#hatch)" opacity="0.5" />
        <rect width="400" height="120" fill="url(#dots)" clip-path="url(#dotsA)" opacity="0.8" />
        <rect width="400" height="120" fill="url(#dots)" clip-path="url(#dotsB)" opacity="0.8" />
        <g transform="rotate(-35 200 60)">
            <rect x="60" y="30" width="300" height="14" fill="#072b66" />
            <rect x="-40" y="92" width="260" height="20" fill="#072b66" />
            <rect x="240" y="8" width="220" height="10" fill="#072b66" />
            <rect x="150" y="20" width="6" height="6" fill="#9fd0ff" />
            <rect x="290" y="88" width="5" height="5" fill="#9fd0ff" />
            <rect x="40" y="48" width="220" height="7" fill="url(#bar)" />
            <rect x="180" y="62" width="260" height="10" fill="url(#bar)" />
            <rect x="110" y="80" width="140" height="4" fill="url(#bar)" />
            <rect x="-30" y="104" width="200" height="6" fill="url(#bar)" />
            <rect x="300" y="20" width="160" height="5" fill="url(#bar)" />
            <rect x="80" y="58" width="200" height="1.2" fill="#b8f2ff" />
            <rect x="220" y="88" width="180" height="1.2" fill="#b8f2ff" />
        </g>
    </g>
</svg>
