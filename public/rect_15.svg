<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
    <!-- Bokeh : bulles de lumière floues + reflet en diagonale -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a3d8f" />
            <stop offset="1" stop-color="#0d55bd" />
        </linearGradient>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
        <filter id="blurA" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1" /></filter>
        <filter id="blurB" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" /></filter>
        <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#b8f2ff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#b8f2ff" stop-opacity="0.8" />
            <stop offset="1" stop-color="#b8f2ff" stop-opacity="0" />
        </linearGradient>
    </defs>

    <g clip-path="url(#clip)">
        <rect width="400" height="120" fill="url(#bg)" />

        <!-- Bulles générées : deux niveaux de flou pour donner de la profondeur -->
        <g>
            <circle cx="170" cy="75" r="10" fill="#8ae8ff" opacity="0.37" filter="url(#blurA)" />
            <circle cx="285" cy="4" r="12" fill="#8ae8ff" opacity="0.40" filter="url(#blurA)" />
            <circle cx="58" cy="60" r="20" fill="#5fb0ff" opacity="0.28" filter="url(#blurB)" />
            <circle cx="407" cy="56" r="26" fill="#5fb0ff" opacity="0.20" filter="url(#blurB)" />
            <circle cx="389" cy="11" r="19" fill="#5fb0ff" opacity="0.32" filter="url(#blurA)" />
            <circle cx="236" cy="23" r="7" fill="#5fb0ff" opacity="0.29" filter="url(#blurA)" />
            <circle cx="61" cy="-5" r="9" fill="#5fb0ff" opacity="0.40" filter="url(#blurA)" />
            <circle cx="50" cy="103" r="24" fill="#8ae8ff" opacity="0.22" filter="url(#blurA)" />
            <circle cx="301" cy="128" r="8" fill="#5fb0ff" opacity="0.26" filter="url(#blurB)" />
            <circle cx="45" cy="77" r="18" fill="#8ae8ff" opacity="0.37" filter="url(#blurB)" />
            <circle cx="215" cy="72" r="14" fill="#5fb0ff" opacity="0.20" filter="url(#blurB)" />
            <circle cx="120" cy="-4" r="21" fill="#8ae8ff" opacity="0.19" filter="url(#blurA)" />
            <circle cx="-19" cy="29" r="15" fill="#5fb0ff" opacity="0.26" filter="url(#blurA)" />
            <circle cx="273" cy="99" r="12" fill="#5fb0ff" opacity="0.29" filter="url(#blurB)" />
            <circle cx="76" cy="12" r="23" fill="#5fb0ff" opacity="0.37" filter="url(#blurB)" />
            <circle cx="201" cy="51" r="15" fill="#8ae8ff" opacity="0.35" filter="url(#blurB)" />
            <circle cx="98" cy="16" r="22" fill="#5fb0ff" opacity="0.21" filter="url(#blurB)" />
            <circle cx="150" cy="66" r="21" fill="#8ae8ff" opacity="0.22" filter="url(#blurA)" />
            <circle cx="17" cy="-4" r="12" fill="#8ae8ff" opacity="0.35" filter="url(#blurB)" />
            <circle cx="299" cy="66" r="22" fill="#8ae8ff" opacity="0.25" filter="url(#blurB)" />
            <circle cx="92" cy="55" r="25" fill="#5fb0ff" opacity="0.31" filter="url(#blurA)" />
            <circle cx="355" cy="71" r="11" fill="#5fb0ff" opacity="0.40" filter="url(#blurA)" />
            <circle cx="418" cy="86" r="14" fill="#8ae8ff" opacity="0.16" filter="url(#blurA)" />
            <circle cx="88" cy="22" r="18" fill="#5fb0ff" opacity="0.34" filter="url(#blurB)" />
            <circle cx="229" cy="83" r="7" fill="#8ae8ff" opacity="0.24" filter="url(#blurB)" />
            <circle cx="162" cy="107" r="12" fill="#8ae8ff" opacity="0.36" filter="url(#blurA)" />
        </g>

        <!-- Reflet -->
        <g transform="rotate(-15 200 60)">
            <rect x="-20" y="58" width="440" height="2" fill="url(#streak)" />
            <rect x="40" y="66" width="320" height="1" fill="url(#streak)" opacity="0.6" />
        </g>
    </g>
</svg>
