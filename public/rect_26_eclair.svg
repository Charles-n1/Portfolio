    <!-- Low-poly sombre + chevron de panneaux + barre lumineuse + passage de l’éclair -->
    <defs>
        <clipPath id="clip"><rect width="400" height="120" /></clipPath>
        <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
            <feGaussianBlur stdDeviation="1.8" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#020a1c" flood-opacity="0.6" />
        </filter>
        <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#0b4aa8" />
            <stop offset="1" stop-color="#1166d0" />
        </linearGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8ae8ff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#b8f2ff" stop-opacity="1" />
            <stop offset="1" stop-color="#8ae8ff" stop-opacity="0" />
        </linearGradient>
        <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="0.9" fill="#9fd0ff" />
        </pattern>
        <clipPath id="dotsArea"><rect x="0" y="0" width="100" height="42" /></clipPath>
    </defs>

    <g clip-path="url(#clip)">
