        <!-- Chevron « > » fait de deux panneaux -->
        <g filter="url(#shadow)">
            <polygon points="200,0 236,0 296,60 260,60" fill="url(#panel)" />
            <polygon points="260,60 296,60 236,120 200,120" fill="url(#panel)" />
        </g>
        <g fill="none" stroke="#8ae8ff" stroke-width="2" filter="url(#glow)">
            <polyline points="236,0 296,60 236,120" />
        </g>
        <polyline points="250,0 310,60 250,120" fill="none" stroke="#5fb0ff" stroke-width="5" opacity="0.6" />

        <!-- Barre lumineuse horizontale -->
        <rect x="-20" y="58" width="260" height="4" fill="url(#beam)" filter="url(#glow)" />
        <rect x="20" y="70" width="180" height="1.4" fill="#5fb0ff" opacity="0.7" />
